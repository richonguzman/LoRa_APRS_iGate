; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ttgo-lora32-v21

extra_configs =
	common_settings.ini
	variants/*/platformio.ini

[env]
platform = espressif32 @ 6.12.0
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
board_build.embed_files =
	data_embed/index.html.gz
	data_embed/style.css.gz
	data_embed/script.js.gz
	data_embed/bootstrap.css.gz
	data_embed/bootstrap.js.gz
	data_embed/favicon.png.gz
extra_scripts =
	pre:tools/compress.py
debug_tool = esp-prog

; ===========================================================================
; RP2350 port — WIZnet W5500-EVB-Pico2 + E22 (arduino-pico + FreeRTOS SMP).
; Minimal GREEN baseline: compiles only src/rp2350/ (the validated LoRa RX +
; W5500 + FreeRTOS firmware) while we port the iGate modules one by one.
; Overrides the ESP32-centric [env] defaults (platform/embed/partitions/scripts).
[env:rp2350_igate]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = wiznet_5500_evb_pico2
board_build.core = earlephilhower
debug_tool = cmsis-dap
board_build.filesystem_size = 0.5m
board_build.embed_files =
board_build.partitions =
extra_scripts =
build_src_filter = -<*> +<rp2350/> +<configuration.cpp>
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-I variants/RP2350_WIZnet_W5500_E22P
	-D PIN_LORA_SCK=10
	-D PIN_LORA_MOSI=11
	-D PIN_LORA_MISO=12
	-D PIN_LORA_CS=13
	-D PIN_LORA_RST=15
	-D PIN_LORA_DIO1=14
	-D PIN_LORA_BUSY=2
	-D PIN_LORA_RFEN=3
	-D PIN_ETH_MISO=16
	-D PIN_ETH_SCK=18
	-D PIN_ETH_MOSI=19
	-D PIN_ETH_CS=17
	-D PIN_ETH_RST=20
	-D PIN_WX_SDA=4
	-D PIN_WX_SCL=5
lib_deps =
	jgromes/RadioLib @ ^7.0.0
	arduino-libraries/Ethernet @ ^2.0.2
	bblanchon/ArduinoJson @ 7.4.2
	richonguzman/APRSPacketLib @ 1.0.4
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit Unified Sensor @ 1.1.15