; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ttgo-lora32-v21

extra_configs =
	common_settings.ini
	variants/*/platformio.ini

[env]
platform = espressif32 @ 6.12.0
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
board_build.embed_files =
	data_embed/index.html.gz
	data_embed/style.css.gz
	data_embed/script.js.gz
	data_embed/bootstrap.css.gz
	data_embed/bootstrap.js.gz
	data_embed/favicon.png.gz
extra_scripts =
	pre:tools/compress.py
debug_tool = esp-prog

; ===========================================================================
; RP2350 port — WIZnet W5500-EVB-Pico2 + E22 (arduino-pico + FreeRTOS SMP).
; Minimal GREEN baseline: compiles only src/rp2350/ (the validated LoRa RX +
; W5500 + FreeRTOS firmware) while we port the iGate modules one by one.
; Overrides the ESP32-centric [env] defaults (platform/embed/partitions/scripts).
[env:rp2350_igate]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = wiznet_5500_evb_pico2
board_build.core = earlephilhower
debug_tool = cmsis-dap
board_build.filesystem_size = 0.5m
board_build.embed_files =
board_build.partitions =
extra_scripts =
build_src_filter = -<*> +<rp2350/> +<configuration.cpp> +<kiss_utils.cpp>
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-I variants/RP2350_WIZnet_W5500_E22P
	-D PIN_LORA_SCK=10
	-D PIN_LORA_MOSI=11
	-D PIN_LORA_MISO=12
	-D PIN_LORA_CS=13
	-D PIN_LORA_RST=15
	-D PIN_LORA_DIO1=14
	-D PIN_LORA_BUSY=2
	-D PIN_LORA_RFEN=3
	-D PIN_ETH_MISO=16
	-D PIN_ETH_SCK=18
	-D PIN_ETH_MOSI=19
	-D PIN_ETH_CS=17
	-D PIN_ETH_RST=20
	-D PIN_WX_SDA=4
	-D PIN_WX_SCL=5
lib_deps =
	jgromes/RadioLib @ ^7.0.0
	arduino-libraries/Ethernet @ ^2.0.2
	bblanchon/ArduinoJson @ 7.4.2
	richonguzman/APRSPacketLib @ 1.0.4
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
	adafruit/Adafruit Unified Sensor @ 1.1.15
	mikalhart/TinyGPSPlus @ 1.0.3
	knolleary/PubSubClient @ ^2.8

; Pico 2 + external W5500 carrier board: same RP2350 iGate as rp2350_igate, but
; on a genuine Raspberry Pi Pico 2 (VSYS divider calibration differs) with an
; E22-400M30S (SX1268) radio for the real 433 MHz LoRa-APRS network. Inherits
; everything from rp2350_igate; only the variant include (SX1268) and the VSYS
; calibration differ. Freq (433.775) stays a runtime web-config value.
[env:rp2350_igate_e22]
extends = env:rp2350_igate
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-I variants/RP2350_Pico2_W5500_E22
	-D VSYS_CAL=1.69f
	-D PIN_LORA_SCK=10
	-D PIN_LORA_MOSI=11
	-D PIN_LORA_MISO=12
	-D PIN_LORA_CS=13
	-D PIN_LORA_RST=15
	-D PIN_LORA_DIO1=14
	-D PIN_LORA_BUSY=2
	-D PIN_LORA_RFEN=3
	-D PIN_ETH_MISO=16
	-D PIN_ETH_SCK=18
	-D PIN_ETH_MOSI=19
	-D PIN_ETH_CS=17
	-D PIN_ETH_RST=20
	-D PIN_WX_SDA=4
	-D PIN_WX_SCL=5

; Physical "-2" Pico 2 carrier: identical to rp2350_igate_e22 (E22-400M30S,
; VSYS_CAL, canonical RF-switch with TXEN on GP28) BUT the W5500 SPI0 lines are
; RELOCATED (MISO=20/SCK=22/MOSI=7/CS=21/RST=6) because GP16-19 were damaged on
; that board. Use this env to flash that specific board; the standard-pin
; rp2350_igate_e22 will NOT talk to its W5500 (DHCP FAILED with link LED on).
[env:rp2350_igate_e22_2]
extends = env:rp2350_igate
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-D RADIOLIB_LOW_LEVEL=1        ; expose RadioLib getMod() for the SX126x RX-sensitivity patch (test/sx126x-rx-patch, upstream PR #440)
	-I variants/RP2350_Pico2_W5500_E22
	-D VSYS_CAL=1.69f
	-D PIN_LORA_SCK=10
	-D PIN_LORA_MOSI=11
	-D PIN_LORA_MISO=12
	-D PIN_LORA_CS=13
	-D PIN_LORA_RST=15
	-D PIN_LORA_DIO1=14
	-D PIN_LORA_BUSY=2
	-D PIN_LORA_RFEN=3
	-D PIN_ETH_MISO=20
	-D PIN_ETH_SCK=22
	-D PIN_ETH_MOSI=7
	-D PIN_ETH_CS=21
	-D PIN_ETH_RST=6
	-D PIN_WX_SDA=4
	-D PIN_WX_SCL=5

; WIZnet W5100S-EVB-Pico2 populated on the w5500_evb_pico2_e22p carrier in place
; of a W5500 (different chip, incompatible with the arduino-libraries/Ethernet
; W5500 driver). Same pinout and radio (E22P-433M30S) as rp2350_igate; only the
; Ethernet driver differs: RAK13800_W5100S (real W5100S support, same Ethernet /
; EthernetClient API). -D USE_W5100S switches init() to the two-arg form; the
; compat_w5100s include dir provides an <Ethernet.h> shim that pulls the driver.
[env:rp2350_igate_w5100s]
extends = env:rp2350_igate
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-I variants/RP2350_WIZnet_W5500_E22P
	-I src/rp2350/compat_w5100s
	-D USE_W5100S
	-D HAS_SX1268                  ; this E22P-433M30S die reports "SX1268" (RadioLib SX1262 class -> -2)
	-D RADIO_TXEN=28               ; this board's DIO2->TXEN bridge was cut and TXEN wired to GP28 -> canonical RF switch (setRfSwitchPins)
	; NOTE: LORA_RX_POLL is NOT needed here - the DIO1 IRQ deafness (5ef40ce) was a
	; symptom of the pre-RF-switch-mod wiring, not a permanent carrier defect. Once
	; RADIO_TXEN=28 landed, DIO1 fired normally (verified with an ISR counter probe,
	; poll removed in 07f113f). Re-adding it would just reintroduce dead code.
	-D RADIOLIB_LOW_LEVEL=1        ; expose RadioLib getMod() for the SX126x RX-sensitivity patch (test/sx126x-rx-patch, upstream PR #440)
	-D PIN_LORA_SCK=10
	-D PIN_LORA_MOSI=11
	-D PIN_LORA_MISO=12
	-D PIN_LORA_CS=13
	-D PIN_LORA_RST=15
	-D PIN_LORA_DIO1=14
	-D PIN_LORA_BUSY=2
	-D PIN_LORA_RFEN=3
	-D PIN_ETH_MISO=16
	-D PIN_ETH_SCK=18
	-D PIN_ETH_MOSI=19
	-D PIN_ETH_CS=17
	-D PIN_ETH_RST=20
	-D PIN_WX_SDA=4              ; GP4 = I2C0 SDA (SHT40)
	-D PIN_WX_SCL=5             ; GP5 = I2C0 SCL (SHT40)
	-D HAS_GPS                  ; GPS reader (UART1 / Serial2)
	-D PIN_GPS_TX=8             ; GP8 = UART1 TX -> GPS RX
	-D PIN_GPS_RX=9             ; GP9 = UART1 RX <- GPS TX
	-D GPS_BAUDRATE=38400      ; DL20U9A default NMEA baud
lib_deps =
	jgromes/RadioLib @ ^7.0.0
	https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip
	bblanchon/ArduinoJson @ 7.4.2
	richonguzman/APRSPacketLib @ 1.0.4
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
	adafruit/Adafruit Unified Sensor @ 1.1.15
	mikalhart/TinyGPSPlus @ 1.0.3
	knolleary/PubSubClient @ ^2.8