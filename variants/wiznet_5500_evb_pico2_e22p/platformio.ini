; WIZnet W5500-EVB-Pico2 (RP2350 + W5500 on board) + Ebyte E22 / E22P carrier
; Hardware: https://github.com/cvaldess/Wiznet_5500_EVB_Pico2_E22P
; RP2350 boards build src/rp2350/ plus the sources they share with the ESP32
; boards (configuration, KISS, map). Library versions as in common_settings.ini.
[env:wiznet_5500_evb_pico2_e22p]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0dcdd94eead72fdf56ea59a3d7c8aa2f379
board = wiznet_5500_evb_pico2
board_build.core = earlephilhower
board_build.filesystem_size = 0.75m     ; also the OTA ceiling: arduino-pico stages the new image in LittleFS
board_build.embed_files =
board_build.partitions =
extra_scripts = pre:tools/gen_web_assets_rp2350.py
build_src_filter = -<*> +<rp2350/> +<configuration.cpp> +<kiss_utils.cpp> +<map_utils.cpp>
build_flags =
	${common.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
	-D RADIOLIB_LOW_LEVEL=1             ; getMod() for the SX126x RX-sensitivity patch
	-D WIZNET_5500_EVB_PICO2_E22P
build_unflags =
	-Werror                             ; arduino-pico's GCC flags sign-compare in shared sources that the ESP32 one accepts
lib_deps =
	arduino-libraries/Ethernet @ 2.0.2
	bblanchon/ArduinoJson @ 7.4.3
	jgromes/RadioLib @ 7.6.0
	knolleary/PubSubClient @ 2.8
	mikalhart/TinyGPSPlus @ 1.1.0
	richonguzman/APRSPacketLib @ 1.0.10
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
debug_tool = cmsis-dap
